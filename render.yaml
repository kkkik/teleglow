services:
  - type: web
    name: little-gift-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT_USER
        value: GiftRollBank
      - key: DB_PATH
        value: /var/data/gifts.db
    disk:
      name: gift-data
      mountPath: /var/data
      sizeGB: 1
